<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Ипотека — короткая анкета · Циан</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/app.mjs"></script>
  </head>
  <body>
    <div class="presentation">
      <aside class="prototype-bar" aria-label="Управление прототипом">

        <button type="button" id="demo-button" aria-haspopup="dialog">Сценарии <span aria-hidden="true">↗</span></button>

      <div class="phone">
        <div id="app"></div>
      </div>
      <p class="presentation-caption">Циан <span> / </span> Короткая ипотечная анкета</p>
    </div>
    <dialog id="sheet" aria-labelledby="sheet-title"></dialog>
    <div class="sr-only" id="announcement" role="status" aria-live="polite"></div>
    <noscript>Для работы кликабельного прототипа включите JavaScript.</noscript>
  </body>
</html>
